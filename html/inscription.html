<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="/css/inscription.css">
</head>

<body>
    <header>
        <div class="logo">
            <span>[YouCode]</span>
        </div>
        <div class="navigation">
            <nav>
                <a href="/html/accueil.html">Accueil</a>
                <a href="/html/campus.html">Campus</a>
                <a href="#Clubs&Activites">Clubs&Activites</a>
                <a href="#evenements">Evenements</a>
                <a href="#Conseils-nouveaux">Conseils aux nouveaux</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        <div class="recherche-barre">
            <img src="/assets/icons/icons8-search-32.png" alt="search-icon">
        </div>
        <div class="button-inscription">
            <a href="/html/inscription.html">Rejoindre L'aventure</a>
        </div>
    </header>
    <section id="form">
        <h6>TES PREMIERS PAS A YOUCODE</h6>
        <h1>Ton aventure commence par une rencontre</h1>
        <form>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required>

            <label for="prenom">Prenom</label>
            <input type="text" id="prenom" name="prenom" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="tel">Telephone</label>
            <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" placeholder="06-XX-XX-XX-XX"><br>

            <input type="radio" name="campus" value="safi" id="S">
            <label class="radio" for="S">Safi</label><br>

            <input type="radio" name="campus" value="nador" id="N">
            <label class="radio" for="N">Nador</label><br>

            <input type="radio" name="campus" value="youssoufia" id="Y">
            <label class="radio" for="Y">Youssoufia</label><br>

            <button type="submit">S'inscrire</button>
        </form>
    </section>
    <footer>







        
    </footer>
</body>

</html>
